name: Test

on:
  push:
    branches-ignore:
      - main # on main, deploy.yml runs the tests instead
  pull_request:
    branches:
      - main

# GitHub OAuth token for composer to clone the private
# `dixlase/dixlase-onepage` dependency referenced by Core's
# composer.json. The PAT lives in the organization secret
# `COMPOSER_AUTH` with Contents:Read scoped to that repo only.
env:
  COMPOSER_AUTH: ${{ secrets.COMPOSER_AUTH }}

jobs:
  test:
    runs-on: ubuntu-latest
    name: PHPUnit Tests

    steps:
      - name: Checkout plugin
        uses: actions/checkout@v5
        with:
          path: plugin

      - name: Checkout core
        uses: actions/checkout@v5
        with:
          repository: Dixlase/dixlase-core
          ref: main
          token: ${{ secrets.CORE_REPO_TOKEN }}
          path: core

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: sodium, mbstring, json, sqlite3, pdo_sqlite, gd
          coverage: none

      - name: Place plugin into core directory
        run: |
          # Core no longer tracks plugins/ (it is gitignored), so a fresh
          # core checkout has no plugins/ directory. Create it before moving
          # the plugin in, otherwise `mv` fails with "No such file or directory".
          mkdir -p core/plugins
          rm -rf core/plugins/DixlaseSEO
          mv plugin core/plugins/DixlaseSEO

      - name: Cache composer dependencies
        uses: actions/cache@v5
        with:
          path: core/vendor
          key: ${{ runner.os }}-php83-composer-${{ hashFiles('core/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php83-composer-

      - name: Install core composer dependencies
        working-directory: core
        run: composer install --no-interaction --prefer-dist --no-progress --no-scripts

      - name: Sync plugin autoload mappings
        working-directory: core
        run: |
          # Generate composer.local.json (aggregates the plugins' psr-4 mappings).
          # Normally the pre-autoload-dump hook does this, but --no-scripts skips
          # it, so run it explicitly.
          php scripts/sync-local-autoload.php
          composer dump-autoload --no-scripts --optimize

      - name: Setup test environment
        working-directory: core
        env:
          APP_KEY: base64:INAsYduzvVFuYXTFeMS0EkLXHynFalWYt/O9hUlTdfg=
        run: |
          if [ -f .env.example ]; then
            cp .env.example .env
          else
            touch .env
          fi
          echo "APP_KEY=${APP_KEY}" >> .env

      - name: Run PHPUnit tests
        working-directory: core/plugins/DixlaseSEO
        env:
          APP_KEY: base64:INAsYduzvVFuYXTFeMS0EkLXHynFalWYt/O9hUlTdfg=
        run: ../../vendor/bin/phpunit
