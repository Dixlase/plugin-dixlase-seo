name: Test

on:
  push:
    branches-ignore:
      # main only fast-forwards to a release tag, whose commit was already
      # tested on next
      - main
  pull_request:
    branches:
      - next # development: every pull request targets next
      - main # a hotfix released from main

jobs:
  test:
    runs-on: ubuntu-latest
    name: ${{ matrix.php == '8.3' && 'PHPUnit Tests' || format('PHPUnit Tests (PHP {0})', matrix.php) }}

    # Every PHP version from core's floor (^8.3) up (Dixlase/dixlase-core#977).
    # 8.6 is a development build in setup-php (8.6.0-dev) until it is
    # released, so its legs report but do not fail the workflow; move it
    # into `php` once setup-php lists it as stable. The 8.3 leg keeps the
    # check name the rulesets require, so the extra versions add checks
    # without renaming that one.
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        experimental: [false]
        include:
          - php: '8.6'
            experimental: true

    steps:
      - name: Checkout plugin
        uses: actions/checkout@v5
        with:
          path: plugin

      - name: Checkout core
        uses: actions/checkout@v5
        with:
          repository: Dixlase/dixlase-core
          ref: main
          path: core

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: sodium, mbstring, json, sqlite3, pdo_sqlite, gd
          coverage: none

      - name: Place plugin into core directory
        run: |
          # Core no longer tracks plugins/ (it is gitignored), so a fresh
          # core checkout has no plugins/ directory. Create it before moving
          # the plugin in, otherwise `mv` fails with "No such file or directory".
          mkdir -p core/plugins
          rm -rf core/plugins/DixlaseSEO
          mv plugin core/plugins/DixlaseSEO

      - name: Cache composer dependencies
        uses: actions/cache@v5
        with:
          path: core/vendor
          key: ${{ runner.os }}-php${{ matrix.php }}-composer-${{ hashFiles('core/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php${{ matrix.php }}-composer-

      - name: Install core composer dependencies
        working-directory: core
        run: composer install --no-interaction --prefer-dist --no-progress --no-scripts

      - name: Sync plugin autoload mappings
        working-directory: core
        run: |
          # Generate composer.local.json (aggregates the plugins' psr-4 mappings).
          # Normally the pre-autoload-dump hook does this, but --no-scripts skips
          # it, so run it explicitly.
          php scripts/sync-local-autoload.php
          composer dump-autoload --no-scripts --optimize

      - name: Setup test environment
        working-directory: core
        env:
          APP_KEY: base64:INAsYduzvVFuYXTFeMS0EkLXHynFalWYt/O9hUlTdfg=
        run: |
          if [ -f .env.example ]; then
            cp .env.example .env
          else
            touch .env
          fi
          echo "APP_KEY=${APP_KEY}" >> .env

      - name: Run PHPUnit tests
        working-directory: core/plugins/DixlaseSEO
        env:
          APP_KEY: base64:INAsYduzvVFuYXTFeMS0EkLXHynFalWYt/O9hUlTdfg=
        run: ../../vendor/bin/phpunit
