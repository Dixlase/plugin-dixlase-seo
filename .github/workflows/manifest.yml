name: Manifest

# The signature manifest has to still describe the tree when the merge lands.
# Nothing signs on a merge: signing happens in one place, from a working copy,
# so a pull request merged on GitHub leaves `main` drifted and the next deploy
# carries that drift to production. Dixlase/dixlase-core#520.
#
# This needs no secret and no core checkout -- it recomputes SHA-256 and
# compares. Cryptographic verification is a separate, later step.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  manifest:
    runs-on: ubuntu-latest
    name: Signed Manifest

    steps:
      - name: Checkout plugin
        uses: actions/checkout@v5

      - name: Recompute every signed file's hash
        run: .github/scripts/check-manifest.sh plugin.json
