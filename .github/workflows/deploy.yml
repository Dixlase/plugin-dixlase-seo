name: Deploy Plugin

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    name: Run tests before deploy

    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Checkout core
        uses: actions/checkout@v4
        with:
          repository: Dixlase/dixlase-core
          ref: main
          token: ${{ secrets.CORE_REPO_TOKEN }}
          path: core

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: sodium, mbstring, json, sqlite3, pdo_sqlite, gd
          coverage: none

      - name: Place plugin into core directory
        run: |
          rm -rf core/plugins/DixlaseSEO
          mv plugin core/plugins/DixlaseSEO

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: core/vendor
          key: ${{ runner.os }}-php83-composer-${{ hashFiles('core/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php83-composer-

      - name: Install core composer dependencies
        working-directory: core
        run: composer install --no-interaction --prefer-dist --no-progress --no-scripts

      - name: Sync plugin autoload mappings
        working-directory: core
        run: |
          php scripts/sync-local-autoload.php
          composer dump-autoload --no-scripts --optimize

      - name: Setup test environment
        working-directory: core
        env:
          APP_KEY: base64:INAsYduzvVFuYXTFeMS0EkLXHynFalWYt/O9hUlTdfg=
        run: |
          if [ -f .env.example ]; then
            cp .env.example .env
          else
            touch .env
          fi
          echo "APP_KEY=${APP_KEY}" >> .env

      - name: Run PHPUnit tests
        working-directory: core/plugins/DixlaseSEO
        env:
          APP_KEY: base64:INAsYduzvVFuYXTFeMS0EkLXHynFalWYt/O9hUlTdfg=
        run: ../../vendor/bin/phpunit

  deploy:
    runs-on: ubuntu-latest
    needs: test
    name: Deploy to production

    steps:
      - name: Set deploy target
        id: target
        run: |
          if [ "${{ github.repository }}" = "Dixlase/plugin-dixlase-seo" ]; then
            echo "env=production" >> $GITHUB_OUTPUT
            echo "base_dir=/srv/dixlase" >> $GITHUB_OUTPUT
          else
            echo "env=staging" >> $GITHUB_OUTPUT
            echo "base_dir=/srv/dixlase/staging" >> $GITHUB_OUTPUT
          fi

      - name: Deploy plugin via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            BASE="${{ steps.target.outputs.base_dir }}"
            PLUGIN_DIR="DixlaseSEO"

            for SITE in brand; do
              DEST="$BASE/$SITE/plugins/$PLUGIN_DIR"
              echo "=== Deploying plugin $PLUGIN_DIR to $SITE (${{ steps.target.outputs.env }}) ==="

              # deploy ユーザーが操作できるよう所有権を戻す
              if [ -d "$DEST" ]; then
                docker exec compose-php-1 chown -R 1001:1001 /var/www/apps/$SITE/plugins/$PLUGIN_DIR
              fi

              if [ ! -d "$DEST" ]; then
                git clone --branch main git@github.com:${{ github.repository }}.git "$DEST"
              else
                cd "$DEST"
                git fetch origin
                git reset --hard origin/main
              fi

              if [ -f "$DEST/composer.json" ]; then
                docker exec compose-php-1 bash -c "cd /var/www/apps/$SITE && composer dump-autoload --no-dev --optimize"
              fi
            done

            echo "=== Plugin deploy complete ==="
